<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGlancer - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-purple-dark: #6d28d9;
            --danger-bg: #450a0a;
            --danger-border: #991b1b;
            --danger-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.15);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .brand-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .error-banner {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .error-banner.visible {
            display: flex;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        .hcaptcha-wrapper {
            margin: 1.5rem 0;
            display: flex;
            justify-content: center;
            min-height: 78px;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover:not(:disabled) {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.5);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hint-text {
            text-align: center;
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <h1>📸 WebGlancer</h1>
            <p>Visual Change Monitoring Suite Dashboard</p>
        </div>

        <div id="errorBanner" class="error-banner">
            <span>⚠️</span>
            <span id="errorMessage">Invalid login credentials</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" class="form-input" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <!-- hCaptcha Widget -->
            <div class="hcaptcha-wrapper">
                <div id="hcaptchaWidget" class="h-captcha" data-sitekey="56d027fa-471e-4af2-bf82-f8a453acb8e2" data-theme="dark"></div>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">
                <span class="spinner" id="loginSpinner"></span>
                <span id="loginBtnText">Sign In to Dashboard</span>
            </button>
        </form>

        <p class="hint-text">🔒 Session protected with hCaptcha verification</p>
    </div>

    <script>
        // Fetch hCaptcha sitekey dynamically from server if available
        fetch('/api/hcaptcha-config')
            .then(res => res.json())
            .then(data => {
                if (data.sitekey && data.sitekey !== '56d027fa-471e-4af2-bf82-f8a453acb8e2') {
                    const widget = document.getElementById('hcaptchaWidget');
                    if (widget) {
                        widget.setAttribute('data-sitekey', data.sitekey);
                    }
                }
            })
            .catch(() => {});

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            const msgEl = document.getElementById('errorMessage');
            msgEl.textContent = msg;
            banner.classList.add('visible');
        }

        function clearError() {
            const banner = document.getElementById('errorBanner');
            banner.classList.remove('visible');
        }

        async function handleLogin(event) {
            event.preventDefault();
            clearError();

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const hcaptchaResponse = typeof hcaptcha !== 'undefined' ? hcaptcha.getResponse() : '';

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            if (!hcaptchaResponse) {
                showError('Please complete the hCaptcha verification challenge.');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            const loginSpinner = document.getElementById('loginSpinner');
            const loginBtnText = document.getElementById('loginBtnText');

            loginBtn.disabled = true;
            loginSpinner.style.display = 'inline-block';
            loginBtnText.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        hcaptcha_response: hcaptchaResponse
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to report dashboard on success
                    window.location.href = '/report.html';
                } else {
                    showError(data.message || 'Login failed. Please try again.');
                    if (typeof hcaptcha !== 'undefined') {
                        hcaptcha.reset();
                    }
                }
            } catch (err) {
                showError('Network error during login: ' + err.message);
                if (typeof hcaptcha !== 'undefined') {
                    hcaptcha.reset();
                }
            } finally {
                loginBtn.disabled = false;
                loginSpinner.style.display = 'none';
                loginBtnText.textContent = 'Sign In to Dashboard';
            }
        }
    </script>
</body>
</html>
