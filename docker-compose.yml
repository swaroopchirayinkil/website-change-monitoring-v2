version: "3.8"

services:
  webglancer:
    build:
      context: .
      dockerfile: Dockerfile
    image: webglancer:latest
    container_name: webglancer-app
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist baselines, latest checks, diff heatmaps, history, and schedule config
      - webglancer_data:/app/.visual_cache
      # Persist domain target list
      - ./.domain.txt:/app/domain.txt:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  webglancer_data:
    driver: local
    name: webglancer_data
